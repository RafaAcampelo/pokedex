<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Pokedex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pokedex">

    <header class="topo">
        <button class="surprise">Surprise Me!</button>

        <div class="ordenacao">
            <label for="sort">Sort By</label>

            <select id="sort">
                <option >Lowest Number (First)</option>
                <option >Highest Number (First)</option>
                <option >Name (A-Z)</option>
            </select>
        </div>
    </header>

    <section class="pokemon-list">

        <article class="pokemon">
            <div class="imagem">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" alt="Bulbasaur">
            </div>
            <p class="numero">#0001</p>
            <h2>Bulbasaur</h2>
            <div class="tipos">
                <span class="grass">Grass</span>
                <span class="poison">Poison</span>
            </div>
        </article>

        <article class="pokemon">
            <div class="imagem">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/2.png" alt="Ivysaur">
            </div>
            <p class="numero">#0002</p>
            <h2>Ivysaur</h2>
            <div class="tipos">
                <span class="grass">Grass</span>
                <span class="poison">Poison</span>
            </div>
        </article>

        <article class="pokemon">
            <div class="imagem">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/3.png" alt="Venusaur">
            </div>
            <p class="numero">#0003</p>
            <h2>Venusaur</h2>
            <div class="tipos">
                <span class="grass">Grass</span>
                <span class="poison">Poison</span>
            </div>
        </article>

         <article class="pokemon">
                <div class="imagem">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png" alt="Charmander">
                </div>
                <p class="numero">#0004</p>
                <h2>Charmander</h2>
                <div class="tipos">
                    <span class="fire">Fire</span>
                </div>
            </article>

            <article class="pokemon">
                <div class="imagem">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/5.png" alt="Charmeleon">
                </div>
                <p class="numero">#0005</p>
                <h2>Charmeleon</h2>
                <div class="tipos">
                    <span class="fire">Fire</span>
                </div>
            </article>

            <article class="pokemon">
                <div class="imagem">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" alt="Charizard">
                </div>
                <p class="numero">#0006</p>
                <h2>Charizard</h2>
                <div class="tipos">
                    <span class="fire">Fire</span>
                    <span class="flying">Flying</span>
                </div>
            </article>

             <article class="pokemon">
                <div class="imagem">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png" alt="Squirtle">
                </div>
                <p class="numero">#0007</p>
                <h2>Squirtle</h2>
                <div class="tipos">
                    <span class="water">Water</span>
                </div>
            </article>

            <article class="pokemon">
                <div class="imagem">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/8.png" alt="Wartortle">
                </div>
                <p class="numero">#0008</p>
                <h2>Wartortle</h2>
                <div class="tipos">
                    <span class="water">Water</span>
                </div>
            </article>

    </section>

    <footer>
        <p>Minha Pokedex - Geração I</p>
    </footer>


    </main>
</body>
</html>
